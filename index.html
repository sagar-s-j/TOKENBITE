<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skip the Queue: order ahead at any hotel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0B2B2A;--tk:#FFC72C;--pp:#F3F5F2;--gr:#1FB57A;--rd:#E5484D;--mu:#5E7472;--ln:#DCE3E0;--d:'Unbounded',system-ui,sans-serif;--b:'Figtree',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font:500 15px/1.55 var(--b);background:var(--pp);color:var(--ink);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--tk);outline-offset:2px}
h1,h2,h3,.tn,.dg,.logo,.tk2{font-family:var(--d);font-weight:700;letter-spacing:-.02em;line-height:1.15}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-80px) rotate(-8deg)}60%{transform:rotate(2deg)}to{opacity:1;transform:none}}
@keyframes flip{from{opacity:0;transform:rotateX(90deg)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes cf{to{transform:translate(var(--x),105vh) rotate(var(--r))}}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes sh{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes bm{50%{scale:1.04}}
nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 5vw;background:#F3F5F2e6;backdrop-filter:blur(10px);border-bottom:1px solid var(--ln)}
.logo{font-size:1rem;cursor:pointer}.logo i{font-style:normal;background:var(--tk);padding:1px 7px;border-radius:6px;margin:0 3px}
.nv{display:flex;align-items:center;gap:8px}.nv a{cursor:pointer;font-weight:600;padding:6px 10px}
.pill{background:var(--ink);color:#fff;border-radius:99px;padding:8px 16px;font-size:.85rem;font-weight:600;transition:transform .15s}.pill:active{transform:scale(.95)}.pill.g{background:none;color:var(--ink);border:1.5px solid var(--ln)}
#v{min-height:80vh}#v.in>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.btn{background:var(--ink);color:#fff;border-radius:14px;padding:14px 24px;font-weight:700;box-shadow:0 6px 0 #000a;transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #000a}
.btn.t{background:var(--tk);color:var(--ink);box-shadow:0 6px 0 #B58A00}.btn.t:active{box-shadow:0 2px 0 #B58A00}
.btn.g{background:#fff;color:var(--ink);border:1.5px solid var(--ln);box-shadow:0 6px 0 var(--ln)}.btn.g:active{box-shadow:0 2px 0 var(--ln)}
.btn.sm{padding:9px 16px;font-size:.85rem;border-radius:11px;box-shadow:0 4px 0 #000a}.btn.t.sm{box-shadow:0 4px 0 #B58A00}.btn.g.sm{box-shadow:0 4px 0 var(--ln)}.btn.wide{width:100%}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:5vw;align-items:center;padding:8vh 5vw;max-width:1180px;margin:auto}
h1{font-size:clamp(2rem,5.6vw,3.9rem)}.sub{font-size:1.1rem;color:var(--mu);margin:1.3rem 0 1.8rem;max-width:30em}.cta{display:flex;gap:14px;flex-wrap:wrap}
.tkt{position:relative;background:var(--tk);border-radius:22px;padding:26px;transform-origin:50% 0;animation:drop 1s .15s cubic-bezier(.2,1.2,.3,1) both;box-shadow:0 26px 50px -22px #0B2B2A77}
.tn{font-size:.8rem}.dg{display:flex;gap:8px;font-size:clamp(2.4rem,9vw,3.8rem);perspective:400px;margin-top:6px}.dg span{display:inline-block;animation:flip .6s calc(.8s + var(--i)*.14s) both}
.pf{position:relative;border-top:3px dashed #0B2B2A55;margin:20px -26px 16px}.pf::before,.pf::after{content:'';position:absolute;top:-13px;width:24px;height:24px;border-radius:50%;background:var(--pp)}.pf::before{left:-12px}.pf::after{right:-12px}
.tkt small{display:block;opacity:.75}
.sec{max-width:1180px;margin:auto;padding:4vh 5vw}.sec h2{font-size:clamp(1.4rem,3.6vw,2rem)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:18px;margin-top:22px}
.st{background:#fff;border:1.5px solid var(--ln);border-radius:22px;padding:22px}.st b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--tk);font-family:var(--d);margin-bottom:14px}.st h3{font-size:1.05rem;margin-bottom:6px}.st p{color:var(--mu)}
.own{background:var(--ink);color:#fff;border-radius:28px;padding:44px 5vw;margin:2vh 0 8vh}.own p{opacity:.75;margin:10px 0 22px;max-width:34em}
.pg{max-width:980px;margin:auto;padding:4vh 5vw 14vh}.pg h2{font-size:clamp(1.5rem,4vw,2.1rem);margin:6px 0 18px}
.sb{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--ln);border-radius:16px;padding:0 16px;transition:border-color .2s,box-shadow .2s}.sb:focus-within{border-color:var(--ink);box-shadow:0 0 0 4px #FFC72C88}.sb input{flex:1;border:0;outline:0;background:none;padding:15px 0}
.chs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 20px}
.ch{border:1.5px solid var(--ln);background:#fff;border-radius:99px;padding:7px 15px;font-weight:600;font-size:.85rem;transition:all .2s}.ch.on{background:var(--ink);color:#fff;border-color:var(--ink);transform:scale(1.05)}.ch.x{background:#FDECEC;border-color:var(--rd);color:var(--rd);text-decoration:line-through}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.hc{display:flex;background:#fff;border-radius:20px;cursor:pointer;transition:transform .25s cubic-bezier(.2,.9,.3,1.3),box-shadow .25s;animation:rise .5s calc(var(--i)*55ms) both}.hc.na{animation:none}.hc:hover{transform:translateY(-5px) rotate(-.6deg);box-shadow:0 16px 30px -14px #0B2B2A55}
.th{display:grid;place-items:center;width:96px;font-size:2.4rem;border-radius:20px 0 0 20px;flex:none}.th.lg{width:80px;height:80px;border-radius:20px}
.bd{flex:1;padding:16px 16px 16px 22px;border-left:2.5px dashed var(--ln);position:relative}.bd::before,.bd::after{content:'';position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--pp)}.bd::before{top:-12px}.bd::after{bottom:-12px}
.bd h3{font-size:.95rem;margin-bottom:4px}.bd p{color:var(--mu);font-size:.85rem}.mt{display:flex;gap:14px;margin-top:10px;font-size:.8rem;font-weight:600}.em{color:var(--mu)}
.bk{font-weight:700;margin-bottom:16px;padding:6px 0}.mh{display:flex;gap:16px;align-items:center;margin-bottom:22px}.mh h2{margin:0 0 4px}.mh p{color:var(--mu)}
.it{display:flex;align-items:center;gap:14px;background:#fff;border-radius:18px;padding:12px 14px;margin-bottom:10px;animation:rise .45s calc(var(--i)*45ms) both}
.ie{font-size:1.8rem;width:52px;height:52px;display:grid;place-items:center;background:var(--pp);border-radius:14px}.ib{flex:1}.ib b{display:block}.ib small{color:var(--mu);font-weight:600}.it.so{opacity:.55}.it.so small{color:var(--rd)}
.qt{display:flex;align-items:center;gap:10px}.qt button{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;font-size:1.2rem;transition:transform .15s}.qt button:active{transform:scale(.8)}.qt button:disabled{background:var(--ln)}.qt span{min-width:18px;text-align:center;font-weight:700}
#cb{position:fixed;left:50%;bottom:18px;transform:translate(-50%,160%);width:min(94vw,560px);background:var(--ink);color:#fff;border-radius:20px;padding:12px 14px 12px 22px;display:flex;align-items:center;justify-content:space-between;z-index:30;transition:transform .45s cubic-bezier(.2,1.2,.3,1);box-shadow:0 18px 40px -12px #0B2B2Aaa}#cb.show{transform:translate(-50%,0)}#cb.bump{animation:bm .35s}#cb small{display:block;opacity:.7}
.au{display:grid;place-items:center;padding:6vh 5vw 10vh}.ac{background:#fff;border-radius:26px;padding:28px;width:min(100%,440px);box-shadow:0 24px 50px -28px #0B2B2A66}
.tabs{display:flex;background:var(--pp);border-radius:14px;padding:4px;margin-bottom:22px}.tabs button{flex:1;padding:10px;border-radius:11px;font-weight:700;transition:all .25s}.tabs button.on{background:var(--ink);color:#fff}.t2{max-width:300px}
.ac h2{font-size:1.3rem;margin-bottom:6px}.ac>p{color:var(--mu);margin-bottom:18px}
.f{display:block;margin-bottom:14px;font-weight:600;font-size:.85rem}.f input,.f select{display:block;width:100%;margin-top:6px;padding:13px 14px;border:1.5px solid var(--ln);border-radius:12px;background:var(--pp);outline:0;transition:border-color .2s,box-shadow .2s}.f input:focus,.f select:focus{border-color:var(--ink);box-shadow:0 0 0 4px #FFC72C88}
.er{display:none;background:#FDECEC;color:var(--rd);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-weight:600;font-size:.85rem}.er.show{display:block;animation:sh .4s}
.sw2{text-align:center;margin-top:16px;color:var(--mu)}.sw2 a{color:var(--ink);font-weight:700;cursor:pointer;text-decoration:underline}.hn{background:var(--pp);border-radius:12px;padding:10px 14px;font-size:.8rem;color:var(--mu);margin-top:14px}
.bx{background:#fff;border-radius:20px;padding:18px 20px;margin-bottom:20px}.bx h3{font-size:1rem;margin-bottom:10px}
.ln{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1.5px dashed var(--ln)}.ln.tt{border:0;font-weight:700;font-size:1.1rem;padding-bottom:0}.sh{font-size:1rem;margin:6px 0 12px}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:22px}.pm button{background:#fff;border:2px solid var(--ln);border-radius:16px;padding:16px 8px;font-weight:700;transition:all .2s}.pm button.on{border-color:var(--ink);background:#FFF3C4;transform:translateY(-3px)}
#ov{position:fixed;inset:0;background:#0B2B2Acc;display:none;place-items:center;align-content:center;gap:14px;color:#fff;z-index:50;font-weight:600}#ov.show{display:grid;animation:rise .25s}#ov i{width:46px;height:46px;border:4px solid #fff3;border-top-color:var(--tk);border-radius:50%;animation:sp .7s linear infinite}
.tk{max-width:440px;margin:auto;padding:5vh 5vw 10vh;text-align:center}.tk h2{font-size:1.5rem}.tk>p{color:var(--mu);margin:6px 0 20px}
.ck{width:74px;margin:0 auto 14px;animation:pop .6s both}.ck svg{width:100%;fill:none;stroke:var(--gr);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.ck circle{stroke-dasharray:145;stroke-dashoffset:145;animation:dr .7s .15s forwards}.ck path{stroke-dasharray:40;stroke-dashoffset:40;animation:dr .4s .7s forwards}
.tkt.c{text-align:left;margin-bottom:18px;animation-delay:.3s}.tkt.c .ln{border-color:#0B2B2A33}
.nt{display:flex;gap:10px;text-align:left;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-weight:600;font-size:.9rem}.nt.p{background:#FFF3C4}.nt.d{background:#DDF6EA}.nt.r{background:#FDECEC;color:var(--rd)}.nt.w{background:#FFE4CF}
.cf{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}.cf i{position:absolute;top:-14px;left:var(--l);width:9px;height:14px;background:var(--c);animation:cf var(--t) ease-in forwards}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:20px}.sts div{background:#fff;border-radius:18px;padding:14px 16px}.sts b{display:block;font-family:var(--d);font-size:1.5rem}.sts small{color:var(--mu);font-weight:600}
.oc{background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;animation:rise .45s calc(var(--i)*50ms) both}.oc.na{animation:none}.oc .chs{margin:0}
.oh{display:flex;gap:12px;align-items:center;margin-bottom:12px}.oh>div{flex:1}.oh small{display:block;color:var(--mu)}.tk2{background:var(--tk);padding:6px 10px;border-radius:9px;font-size:.85rem}
.bd2{border-radius:99px;padding:4px 12px;font-size:.78rem;font-weight:700}.bd2.Preparing{background:#FFF3C4}.bd2.Completed{background:#DDF6EA;color:#0C7A4E}.bd2.Rejected{background:#FDECEC;color:var(--rd)}
.of{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1.5px dashed var(--ln)}.of small{flex:1;color:var(--mu)}.hint{color:var(--mu);font-size:.85rem;margin-bottom:12px}
.sw{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer}.sw input{display:none}.sw i{width:46px;height:26px;border-radius:99px;background:var(--ln);position:relative;transition:background .25s}.sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.2,1.4,.4,1)}.sw input:checked+i{background:var(--gr)}.sw input:checked+i::after{transform:translateX(20px)}
#tt{position:fixed;top:76px;left:50%;transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;opacity:0;transition:all .35s cubic-bezier(.2,1.2,.3,1);z-index:70;pointer-events:none}#tt.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:4vh}.nv a{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ===== WOW layer: cursor trail, hero motion, reveals ===== */
.trail{position:fixed;inset:0;z-index:9999;pointer-events:none;transition:opacity .3s}
.trail svg{position:absolute;inset:0;width:100%;height:100%}
.trail path{fill:none;stroke:#0B2B2A;stroke-opacity:.25;stroke-width:2.2;stroke-linecap:round}
.tb{position:absolute;left:0;top:0;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:19px;box-shadow:0 3px 10px #0B2B2A33,inset 0 0 0 1.5px #0B2B2A14;will-change:transform}
.bst,.fly{position:fixed;z-index:9998;pointer-events:none;margin:-12px 0 0 -12px;font-size:24px}
.btn{position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s,translate .25s cubic-bezier(.2,.9,.3,1.3)}
.btn.t:not(.sm)::before{content:'';position:absolute;top:0;left:-70%;width:40%;height:100%;background:linear-gradient(100deg,transparent,#ffffffaa,transparent);transform:skewX(-20deg);animation:shn 3.4s 1.8s infinite}
@keyframes shn{0%{left:-70%}28%,100%{left:140%}}
.hero{position:relative}.hero>.fz+div{position:relative;z-index:1}
.tkt{z-index:1;animation-fill-mode:backwards;transition:transform .25s ease-out}
.tkt::after{content:'';position:absolute;inset:0;border-radius:inherit;background:radial-gradient(circle at var(--sx,50%) var(--sy,0%),#ffffffcc,transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}.tkt:hover::after{opacity:.8}
.fz{position:absolute;inset:0;pointer-events:none;z-index:0}
.fz span{position:absolute;font-size:clamp(1.6rem,3vw,2.6rem);opacity:.4;animation:fz 5s calc(var(--i)*-.8s) ease-in-out infinite alternate;translate:calc(var(--px,0)*var(--k)*46px) calc(var(--py,0)*var(--k)*46px)}
@keyframes fz{to{transform:translateY(-16px) rotate(10deg)}}
@keyframes up{from{transform:translateY(110%) rotate(4deg)}to{transform:none}}
.ln1{display:block;overflow:hidden;padding-bottom:.1em}.ln1 i{display:block;font-style:normal;animation:up .9s var(--d,0s) cubic-bezier(.2,.9,.2,1) both}
.rv{opacity:0;transform:translateY(30px) scale(.96);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.3,1.2);transition-delay:calc(var(--i,0)*100ms)}.rv.v{opacity:1;transform:none}
@keyframes wob{0%,100%{transform:none}30%{transform:scale(1.15) rotate(-8deg)}60%{transform:scale(1.05) rotate(6deg)}}
.hc:hover .th{animation:wob .6s}
#sp{position:fixed;inset:0;z-index:200;background:var(--tk);display:grid;place-content:center;justify-items:center;gap:18px;transition:transform .8s cubic-bezier(.7,0,.2,1)}#sp.go{transform:translateY(-100%)}
.lg2{font-family:var(--d);font-weight:700;font-size:clamp(1.6rem,6vw,2.6rem);animation:pop .6s both}.lg2 i{font-style:normal;background:var(--ink);color:var(--tk);padding:0 10px;border-radius:8px;margin:0 6px}
.bar2{width:170px;height:5px;border-radius:9px;background:#0B2B2A22;overflow:hidden}.bar2::after{content:'';display:block;height:100%;background:var(--ink);animation:fill 1.4s ease-in-out both}
@keyframes fill{from{width:0}to{width:100%}}

/* ===== Floating menu ===== */
#fab{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;flex-direction:column;align-items:flex-end;gap:14px;transition:bottom .45s cubic-bezier(.2,1.2,.3,1)}body.hc #fab{bottom:96px}
#fo{position:fixed;inset:0;z-index:39;background:#0B2B2A66;backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .35s}body.fo #fo{opacity:1;pointer-events:auto}
#fm{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.fi{display:flex;align-items:center;gap:12px;background:#fff;border-radius:99px;padding:7px 20px 7px 7px;font-weight:700;box-shadow:0 12px 26px -10px #0B2B2A99;transform-origin:100% 100%;opacity:0;transform:translate(24px,50px) scale(.4) rotate(10deg);pointer-events:none;transition:transform .35s cubic-bezier(.5,0,.8,.6),opacity .2s,background .2s,translate .25s cubic-bezier(.2,1.4,.4,1);transition-delay:calc(var(--i)*25ms)}
body.fo .fi{opacity:1;transform:none;pointer-events:auto;transition:transform .55s cubic-bezier(.2,1.5,.4,1),opacity .25s,background .2s,translate .25s cubic-bezier(.2,1.4,.4,1);transition-delay:var(--d)}
.fi b{width:42px;height:42px;border-radius:50%;background:var(--pp);display:grid;place-items:center;font-size:1.25rem;transition:transform .3s cubic-bezier(.2,1.5,.4,1),background .2s}
.fi:hover,.fi:focus-visible{translate:-8px 0;background:var(--tk)}.fi:hover b,.fi:focus-visible b{transform:rotate(-14deg) scale(1.18);background:#fff}
.fi.on{background:var(--ink);color:#fff}.fi.on b{background:var(--tk)}
#fb{position:relative;width:62px;height:62px;border-radius:50%;background:var(--tk);box-shadow:0 6px 0 #B58A00,0 18px 28px -10px #0B2B2A99;display:grid;place-content:center;gap:5px;transition:transform .2s,box-shadow .2s}
#fb:hover{transform:translateY(-2px) rotate(-6deg)}#fb:active{transform:translateY(4px);box-shadow:0 2px 0 #B58A00}
#fb::before{content:'';position:absolute;inset:0;border-radius:50%;border:3px solid var(--tk);animation:rg 2.4s ease-out infinite}body.fo #fb::before{animation:none;opacity:0}
@keyframes rg{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.8);opacity:0}}
#fb i{display:block;width:24px;height:3px;border-radius:3px;background:var(--ink);transition:transform .4s cubic-bezier(.2,1.5,.4,1),opacity .2s,width .3s}
body.fo #fb i:nth-child(1){transform:translateY(8px) rotate(45deg)}body.fo #fb i:nth-child(2){opacity:0;width:0}body.fo #fb i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}

/* ===== Preloader: chicken mascot lockup ===== */
#sp{background:radial-gradient(circle at 50% 40%,#FFE27A,var(--tk) 65%)}
#sp::before{content:'';position:absolute;left:0;right:0;top:74%;border-top:3px dashed #0B2B2A55}
#sp::after{content:'';position:absolute;left:0;right:0;top:calc(74% - 14px);height:28px;background:radial-gradient(circle at 0 50%,var(--pp) 13px,transparent 14px) left/50% 100% no-repeat,radial-gradient(circle at 100% 50%,var(--pp) 13px,transparent 14px) right/50% 100% no-repeat}
.lg2{position:relative;display:flex;align-items:center;animation:none;margin-top:clamp(70px,16vw,110px)}
.lg2 i{position:relative}.sk{display:inline-block;animation:rise .6s .1s both}.sk+i+.sk{animation-delay:.25s}
.hn2{position:absolute;left:50%;bottom:100%;width:clamp(74px,17vw,106px);translate:-50% 3px;transform-origin:50% 100%;animation:land .7s .35s cubic-bezier(.3,1.3,.5,1) both}
.hn2 svg{display:block;width:100%;overflow:visible;transform-origin:50% 100%;animation:hp .8s 1.2s ease-in-out infinite}
.wg{transform-origin:46px 66px;animation:flp .45s 1s ease-in-out 3}.ey{transform-origin:91px 33px;animation:bl 2.2s 1.3s infinite}
.tg2{font-weight:600;opacity:.75;font-size:.95rem;animation:rise .6s .5s both}
@keyframes land{0%{transform:translateY(-150px) rotate(-14deg);opacity:0}55%{opacity:1}70%{transform:translateY(0) scale(1.12,.86)}85%{transform:translateY(-9px) scale(.97,1.04)}100%{transform:none;opacity:1}}
@keyframes hp{0%,100%{transform:none}45%{transform:translateY(-10px) scale(.97,1.05)}}
@keyframes flp{50%{transform:rotate(-16deg)}}
